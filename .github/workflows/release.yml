name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to publish artifacts for (for example, v0.1.1)
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Tag to publish artifacts for (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install build
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # NOTE: PyPI trusted publishing (OIDC) cannot run from inside a reusable
  # workflow — the OIDC job_workflow_ref points at this callee, which PyPI
  # cannot match against the configured trusted publisher. The publish job
  # therefore lives in the top-level release-please.yml caller, which downloads
  # the `dist` artifact built above. See pypi/warehouse#11096.

  github-release:
    name: Upload GitHub Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/*
